name: VHF/UHF frontend and FM squelch offline checks

on:
  push:
    branches:
      - feature/vhf-uhf-frontend-integration
    paths:
      - 'ka9q-web.c'
      - 'html/**'
      - 'tests/**'
      - '.github/workflows/vhf-uhf-frontend-checks.yml'
  pull_request:
    paths:
      - 'ka9q-web.c'
      - 'html/**'
      - 'tests/**'
      - '.github/workflows/vhf-uhf-frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript browser logic regressions
        run: node --test tests/*.cjs
      - name: Python protocol and fixture regressions
        run: python3 -m unittest discover -s tests -v
